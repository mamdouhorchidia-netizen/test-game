<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gravity Janitor</title>
<style>
  :root {
    --bg: #070b1a; --panel: #111a33; --line: #2a3a6b; --ink: #e8f0ff; --dim: #8ea0cf;
    --cyan: #36e3ff; --yellow: #ffc83d; --pink: #ff5c8a; --green: #7cff6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  .caps { text-transform: uppercase; letter-spacing: .14em; font-weight: 800; }

  /* Title */
  #title { align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #title h1 { margin: 0; font-size: clamp(40px, 13vw, 76px); line-height: .95; letter-spacing: .04em; font-weight: 900; }
  #title h1 span { display: block; color: var(--cyan); text-shadow: 0 0 24px rgba(54, 227, 255, .55); }
  #title h1 em { display: block; font-style: normal; color: var(--yellow); }
  #title p { color: var(--dim); margin: 18px 0 34px; font-size: 16px; max-width: 30ch; line-height: 1.45; }
  .big {
    border: 0; border-radius: 16px; padding: 16px 44px; font: inherit; font-size: 20px; color: #06121f;
    background: var(--cyan); box-shadow: 0 6px 0 #1596b0, 0 0 30px rgba(54, 227, 255, .35);
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #1596b0; }
  .ghost {
    border: 2px solid var(--line); background: rgba(17, 26, 51, .8); color: var(--ink); border-radius: 14px;
    padding: 12px 22px; font: inherit; font-size: 14px;
  }
  .ghost:active { background: var(--line); }
  #title .ghost { margin-top: 16px; }
  #badge { margin-top: 30px; color: var(--dim); font-size: 12px; }

  /* Play HUD */
  #play { pointer-events: none; justify-content: space-between; }
  #hud { padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #deck { font-size: 12px; color: var(--cyan); }
  #name { font-size: 18px; font-weight: 800; margin-top: 2px; }
  #grav { font-size: 11px; color: var(--dim); margin-top: 4px; }
  #count { text-align: right; white-space: nowrap; }
  #moves { font-size: 28px; font-weight: 900; line-height: 1; }
  #par { font-size: 11px; color: var(--dim); margin-top: 4px; }
  #tip {
    margin: 8px 16px 0; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.35; color: var(--ink);
    background: rgba(17, 26, 51, .85); border: 1px solid var(--line); border-left: 4px solid var(--yellow);
  }
  #tip:empty { display: none; }
  #bar { display: flex; gap: 8px; padding: 0 12px 14px; pointer-events: auto; }
  #bar button {
    flex: 1; min-width: 0; height: 58px; border-radius: 14px; border: 2px solid var(--line); background: rgba(17, 26, 51, .9);
    color: var(--ink); font: inherit; font-size: 10px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px;
  }
  #bar button:active { background: var(--line); }
  #bar svg { width: 22px; height: 22px; fill: none; stroke: var(--cyan); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #bar button.off svg { stroke: var(--dim); opacity: .6; }

  /* Level select */
  #levels { padding: 18px 16px; background: rgba(7, 11, 26, .82); }
  #levels header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #levels h2 { margin: 0; font-size: 20px; }
  #total { color: var(--yellow); font-size: 14px; }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; overflow-y: auto; touch-action: pan-y; padding-bottom: 12px; }
  #grid button {
    aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
    font: inherit; font-size: 19px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #grid button small { font-size: 10px; letter-spacing: .08em; color: var(--yellow); height: 12px; font-weight: 400; }
  #grid button.next { border-color: var(--cyan); box-shadow: 0 0 16px rgba(54, 227, 255, .3); }
  #grid button.locked { color: #3c4a78; border-color: #1a2548; background: #0c1328; }
  #levels .ghost { align-self: center; margin-top: 8px; }

  /* Result card */
  #over { align-items: center; justify-content: center; background: rgba(4, 7, 18, .7); padding: 22px; }
  #card {
    width: 100%; max-width: 360px; background: var(--panel); border: 2px solid var(--line); border-radius: 22px;
    padding: 24px 20px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    animation: pop .28s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }
  #card h2 { margin: 0; font-size: 30px; font-weight: 900; }
  #card.win h2 { color: var(--cyan); } #card.fail h2 { color: var(--pink); }
  #stars { font-size: 44px; letter-spacing: 6px; margin: 10px 0 4px; color: #2a3a6b; }
  #stars b { color: var(--yellow); text-shadow: 0 0 18px rgba(255, 200, 61, .6); font-weight: 400; }
  #line { color: var(--ink); font-size: 15px; line-height: 1.45; margin: 10px 0 6px; }
  #stat { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  #card .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  #card .big { width: 100%; }
  #card .ghost { flex: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<section id="title" class="screen on">
  <h1 class="caps"><span>Gravity</span><em>Janitor</em></h1>
  <p>Mopping is hard. Physics is free.<br>Flip gravity, bin the trash, spare the cat.</p>
  <button class="big caps" id="btnPlay">Clock in</button>
  <button class="ghost caps" id="btnDecks">All decks</button>
  <div id="badge" class="caps">Orbital Station Kevin &middot; Year 2099</div>
</section>

<section id="play" class="screen">
  <div>
    <div id="hud">
      <div>
        <div id="deck" class="caps"></div>
        <div id="name"></div>
        <div id="grav" class="caps"></div>
      </div>
      <div id="count">
        <div id="moves">0</div>
        <div id="par" class="caps"></div>
      </div>
    </div>
    <div id="tip"></div>
  </div>
  <div id="bar">
    <button id="bUndo" class="caps"><svg viewBox="0 0 24 24"><path d="M8 5 3 10l5 5"/><path d="M3 10h11a5 5 0 0 1 0 10h-4"/></svg>Undo</button>
    <button id="bRetry" class="caps"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg>Retry</button>
    <button id="bHint" class="caps"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Hint</button>
    <button id="bDecks" class="caps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Decks</button>
    <button id="bSound" class="caps"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>Sound</button>
  </div>
</section>

<section id="levels" class="screen">
  <header>
    <h2 class="caps">Decks</h2>
    <div id="total" class="caps"></div>
  </header>
  <div id="grid"></div>
  <button class="ghost caps" id="btnBack">Back</button>
</section>

<section id="over" class="screen">
  <div id="card">
    <h2 class="caps" id="verdict"></h2>
    <div id="stars"></div>
    <div id="line"></div>
    <div id="stat" class="caps"></div>
    <button class="big caps" id="oMain"></button>
    <div class="row">
      <button class="ghost caps" id="oA"></button>
      <button class="ghost caps" id="oB">Decks</button>
    </div>
  </div>
</section>

<script src="sim.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
