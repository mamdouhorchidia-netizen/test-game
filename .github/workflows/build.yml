name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check every level is solvable
        run: |
          node tools/check-levels.js
          node tools/check-closecall.js

      - name: Build signed APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk GravityJanitor.apk
          cp closecall/build/outputs/apk/release/closecall-release.apk CloseCall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            GravityJanitor.apk
            CloseCall.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          sleep 3
          gh release create latest CloseCall.apk GravityJanitor.apk \
            --target "$GITHUB_SHA" \
            --title "Latest builds" \
            --notes "Automatic build of commit $GITHUB_SHA. Download CloseCall.apk or GravityJanitor.apk on an Android phone (Android 8 or newer) and open it to install."
