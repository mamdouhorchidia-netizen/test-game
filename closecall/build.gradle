plugins {
    id 'com.android.application'
}

android {
    namespace 'com.testgame.closecall'
    compileSdk 34

    defaultConfig {
        applicationId 'com.testgame.closecall'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Throwaway demo key so every build installs over the previous one.
        // Replace it with a private key before publishing to a store.
        demo {
            storeFile rootProject.file('app/demo.keystore')
            storePassword 'android'
            keyAlias 'demo'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
