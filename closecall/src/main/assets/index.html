<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Close Call</title>
<style>
  :root {
    --bg: #15111c; --panel: #221b2e; --line: #3d3350; --ink: #fff4e0; --dim: #a79bb8;
    --yellow: #ffd23f; --red: #ff4d4d; --teal: #2ee6c8; --pink: #ff7ab8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  .caps { text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
  button { font: inherit; color: var(--ink); }

  /* Title */
  #title { align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #title .clap { font-size: 12px; color: var(--bg); background: var(--yellow); padding: 5px 12px; border-radius: 4px; transform: rotate(-4deg); margin-bottom: 14px; }
  #title h1 { margin: 0; font-size: clamp(46px, 15vw, 84px); line-height: .9; font-weight: 900; letter-spacing: .02em; font-style: italic; }
  #title h1 span { display: block; color: var(--red); text-shadow: 4px 4px 0 #5a1020; }
  #title h1 em { display: block; color: var(--yellow); text-shadow: 4px 4px 0 #6b4a00; }
  #title p { color: var(--dim); margin: 22px 0 32px; font-size: 16px; max-width: 31ch; line-height: 1.45; }
  .big {
    border: 0; border-radius: 14px; padding: 16px 40px; font-size: 20px; color: #2a0b0b;
    background: var(--yellow); box-shadow: 0 6px 0 #a67c00;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #a67c00; }
  .ghost { border: 2px solid var(--line); background: rgba(34, 27, 46, .85); border-radius: 12px; padding: 12px 22px; font-size: 14px; }
  .ghost:active { background: var(--line); }
  #title .ghost { margin-top: 16px; }

  /* Play */
  #play { pointer-events: none; justify-content: space-between; }
  #hud { padding: 12px 14px 0; }
  #top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #scene { font-size: 12px; color: var(--yellow); }
  #name { font-size: 17px; font-weight: 800; margin-top: 2px; font-style: italic; }
  #take { font-size: 12px; color: var(--bg); background: var(--ink); padding: 4px 9px; border-radius: 4px; white-space: nowrap; }
  body.rolling #take { background: var(--red); color: #fff; }
  #meters { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  #hp { display: flex; gap: 3px; align-items: center; }
  #hp i { width: 13px; height: 20px; border-radius: 3px; background: var(--teal); display: block; }
  #hp i.off { background: #3a3048; }
  #hp i.last { background: var(--red); box-shadow: 0 0 10px var(--red); }
  #hp b { font-size: 10px; color: var(--dim); margin-right: 4px; }
  #thrill { flex: 1; }
  #thrill .lab { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-bottom: 3px; }
  #bar { height: 12px; border-radius: 6px; background: #3a3048; position: relative; overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--pink), var(--yellow)); transition: width .2s; }
  #mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .7; }
  #tip {
    margin-top: 9px; padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.35;
    background: rgba(34, 27, 46, .9); border: 1px solid var(--line); border-left: 4px solid var(--yellow);
  }
  #tip:empty { display: none; }
  #tray { padding: 0 10px 12px; pointer-events: auto; }
  #props { display: flex; gap: 7px; justify-content: center; margin-bottom: 8px; min-height: 66px; }
  #props button {
    width: 62px; height: 66px; border-radius: 12px; border: 2px solid var(--line); background: rgba(34, 27, 46, .92);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; position: relative;
  }
  #props button canvas { width: 40px; height: 40px; }
  #props button span { font-size: 9px; color: var(--dim); margin-top: 1px; }
  #props button em { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--yellow); color: #2a0b0b; font-style: normal; font-size: 12px; font-weight: 900; line-height: 20px; text-align: center; }
  #props button.sel { border-color: var(--teal); box-shadow: 0 0 14px rgba(46, 230, 200, .45); }
  #props button.out { opacity: .35; }
  #props button.out em { background: var(--line); color: var(--dim); }
  #ctl { display: flex; gap: 7px; align-items: stretch; }
  #ctl .sm {
    flex: 1; min-width: 0; height: 56px; border-radius: 12px; border: 2px solid var(--line); background: rgba(34, 27, 46, .92);
    font-size: 9.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0;
  }
  #ctl .sm:active { background: var(--line); }
  #ctl svg { width: 20px; height: 20px; fill: none; stroke: var(--yellow); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #ctl .sm.off svg { stroke: var(--dim); opacity: .6; }
  #go { flex: 2.2; height: 56px; border: 0; border-radius: 12px; background: var(--red); color: #fff; font-size: 19px; box-shadow: 0 5px 0 #8f1f1f; font-style: italic; }
  #go:active { transform: translateY(3px); box-shadow: 0 2px 0 #8f1f1f; }
  body.rolling #go { background: var(--ink); color: #2a0b0b; box-shadow: 0 5px 0 #8c8372; }
  body.rolling #props, body.rolling .sm.edit { opacity: .3; pointer-events: none; }

  /* Scene select */
  #levels { padding: 18px 16px; background: rgba(21, 17, 28, .86); }
  #levels header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #levels h2 { margin: 0; font-size: 20px; font-style: italic; }
  #total { color: var(--yellow); font-size: 14px; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; touch-action: pan-y; padding-bottom: 12px; }
  #grid button {
    aspect-ratio: 1.15; border-radius: 12px; border: 2px solid var(--line); background: var(--panel);
    font-size: 20px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #grid button small { font-size: 11px; letter-spacing: .08em; color: var(--yellow); height: 13px; font-weight: 400; }
  #grid button.next { border-color: var(--yellow); box-shadow: 0 0 16px rgba(255, 210, 63, .3); }
  #grid button.locked { color: #4a3f5c; border-color: #2a2238; background: #1a1524; }
  #levels .ghost { align-self: center; margin-top: 8px; }

  /* Review card */
  #over { align-items: center; justify-content: center; background: rgba(10, 7, 14, .72); padding: 22px; }
  #card {
    width: 100%; max-width: 360px; background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    padding: 22px 20px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    animation: pop .28s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }
  #card h2 { margin: 0; font-size: 30px; font-weight: 900; font-style: italic; }
  #card.win h2 { color: var(--yellow); } #card.fail h2 { color: var(--red); }
  #stars { font-size: 44px; letter-spacing: 6px; margin: 8px 0 2px; color: #3d3350; }
  #stars b { color: var(--yellow); text-shadow: 0 0 18px rgba(255, 210, 63, .6); font-weight: 400; }
  #quote { font-size: 16px; line-height: 1.4; margin: 12px 0 4px; font-style: italic; }
  #by { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  #stat { color: var(--dim); font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
  #card .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  #card .big { width: 100%; }
  #card .ghost { flex: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<section id="title" class="screen on">
  <div class="clap caps">Scene 1 &middot; Take 1</div>
  <h1 class="caps"><span>Close</span><em>Call</em></h1>
  <p>You direct the stunts. Your star must survive every scene with exactly 1&nbsp;HP. Any safer and the audience yawns.</p>
  <button class="big caps" id="btnPlay">Roll camera</button>
  <button class="ghost caps" id="btnScenes">All scenes</button>
</section>

<section id="play" class="screen">
  <div id="hud">
    <div id="top">
      <div>
        <div id="scene" class="caps"></div>
        <div id="name"></div>
      </div>
      <div id="take" class="caps"></div>
    </div>
    <div id="meters">
      <div id="hp"></div>
      <div id="thrill">
        <div class="lab caps"><span>Thrill</span><span id="thv"></span></div>
        <div id="bar"><div id="fill"></div><div id="mark"></div></div>
      </div>
    </div>
    <div id="tip"></div>
  </div>
  <div id="tray">
    <div id="props"></div>
    <div id="ctl">
      <button id="bHint" class="sm caps edit"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Hint</button>
      <button id="bClear" class="sm caps edit"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Clear</button>
      <button id="go" class="caps">Action!</button>
      <button id="bScenes" class="sm caps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Scenes</button>
      <button id="bSound" class="sm caps"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>Sound</button>
    </div>
  </div>
</section>

<section id="levels" class="screen">
  <header>
    <h2 class="caps">Scenes</h2>
    <div id="total" class="caps"></div>
  </header>
  <div id="grid"></div>
  <button class="ghost caps" id="btnBack">Back</button>
</section>

<section id="over" class="screen">
  <div id="card">
    <h2 class="caps" id="verdict"></h2>
    <div id="stars"></div>
    <div id="quote"></div>
    <div id="by" class="caps"></div>
    <div id="stat"></div>
    <button class="big caps" id="oMain"></button>
    <div class="row">
      <button class="ghost caps" id="oA"></button>
      <button class="ghost caps" id="oB">Scenes</button>
    </div>
  </div>
</section>

<script src="sim.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
